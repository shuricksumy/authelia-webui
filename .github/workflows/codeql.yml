name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2" # weekly: new queries find old code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the analysis looks up its own workflow run
      security-events: write # upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions] # the app, and the workflows themselves
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
