name: release
on:
  # Only what is merged into main is published. (Not `workflow_run`: its branch filter also matches
  # a fork's PR from a branch named "main", which would publish the fork's commit.)
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly rebuild for base-image / OS security patches
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci: # the full CI on exactly the commit that is published
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      packages: write # GHCR
      id-token: write # cosign keyless
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          echo "authelia=$(scripts/authelia_version.sh)" >> "$GITHUB_OUTPUT"
          echo "app=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/authelia-configurator" >> "$GITHUB_OUTPUT"
      - id: rel
        # A version tag (:0.2.0) is published once, with its GitHub Release; later pushes and the
        # weekly rebuild only move :authelia-<version> and :latest, so a pinned version never changes.
        run: |
          if gh release view "v${APP}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "tag=${IMAGE}:${APP}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.v.outputs.app }}
          IMAGE: ${{ steps.v.outputs.image }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: AUTHELIA_VERSION=${{ steps.v.outputs.authelia }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.v.outputs.image }}:authelia-${{ steps.v.outputs.authelia }}
            ${{ steps.rel.outputs.tag }}
            ${{ steps.v.outputs.image }}:latest
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: GitHub Release (only for new app versions, not for weekly rebuilds)
        if: steps.rel.outputs.new == 'true'
        run: |
          tag="v${APP}"
          gh release create "$tag" --generate-notes \
            --title "$tag (Authelia ${AUTHELIA})" \
            --notes "Image: \`${IMAGE}:authelia-${AUTHELIA}\` (digest \`${DIGEST}\`)"
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.v.outputs.app }}
          AUTHELIA: ${{ steps.v.outputs.authelia }}
          IMAGE: ${{ steps.v.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
