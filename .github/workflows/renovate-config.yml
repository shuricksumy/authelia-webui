name: renovate-config
# Renovate stops all PRs when its config is invalid (it once listed a "uv" manager that does not
# exist); validate the file with Renovate's own validator whenever it changes.
on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate-config.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes --package renovate@44 renovate-config-validator --strict renovate.json
