# The rules the configurator needs to be reachable and safe. They live in managed/access_control.yml
# (the migration script keeps them as they are) and MUST stay above any broad catch-all rule such
# as '*.example.com'. The configurator treats them as protected: it will not let you delete,
# reorder below a weaker rule, or weaken them. Replace the domains and the VPN range.
access_control:
  default_policy: deny
  networks:
    - name: vpn
      networks: [10.8.0.0/24]
  rules:
    # 1. OIDC / portal endpoints must be public or logins and discovery break.
    - domain: auth.example.com
      resources:
        - '^/\.well-known/openid-configuration$'
        - '^/jwks\.json$'
        - '^/api/oidc/.*'
      policy: bypass

    # 2. The portal itself.
    - domain: auth.example.com
      policy: one_factor

    # 3. The configurator: admins, on the VPN, with 2FA.
    - domain: authcfg.example.com
      networks: [vpn]
      subject: 'group:admin'
      policy: two_factor

    # 4. Everyone else gets a hard no (not a login page).
    - domain: authcfg.example.com
      policy: deny
