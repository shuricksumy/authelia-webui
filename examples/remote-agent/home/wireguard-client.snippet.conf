# HOME machine's WireGuard client (e.g. wg_confs/<name>.conf of a WireGuard container in host
# network mode); not a complete file: keys and the endpoint stay as they are.
#
# Add the edge Traefik's address, and ONLY that one, to AllowedIPs: the home machine then sends
# the agent's traffic through this tunnel, and nothing else of the edge network becomes routable.
# Restart the tunnel afterwards. If a dashboard (e.g. wg-easy, WGDashboard) generated the file,
# change the peer's client-side "Endpoint Allowed IPs" there too, never the server-side
# "Allowed IPs" (that one says which source addresses the peer may use).

[Interface]
Address = 10.99.0.2/32

[Peer]
AllowedIPs = 10.99.0.0/24, 172.30.0.2/32
