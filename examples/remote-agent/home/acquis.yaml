# HOME agent log sources (mounted at /etc/crowdsec/acquis.yaml). Paths are inside the container.
#
# Home Assistant under the Supervisor logs to the system journal (docker's journald driver), not
# to a file. Its lines carry colour codes (ESC[32m ... ESC[0m) that stop the parser: every line
# shows as "unparsed". CrowdSec's expressions have no regex replace, so the known codes are
# removed one by one (0 reset, 32 INFO, 33 WARNING, 31 ERROR, 36 DEBUG, 1;31 CRITICAL).
source: journalctl
journalctl_filter:
  - "CONTAINER_NAME=homeassistant"
transform: 'ReplaceAll(ReplaceAll(ReplaceAll(ReplaceAll(ReplaceAll(ReplaceAll(evt.Line.Raw, "\x1b[0m", ""), "\x1b[32m", ""), "\x1b[33m", ""), "\x1b[31m", ""), "\x1b[36m", ""), "\x1b[1;31m", "")'
labels:
  type: home-assistant
---
# Home Assistant as a plain container writing /config/home-assistant.log: use this instead
# (mount the config FOLDER read-only: HA starts a new file at every restart).
# filenames:
#   - /logs/homeassistant/home-assistant.log
# labels:
#   type: home-assistant
# ---
# Nextcloud's own log (nextcloud.log in its data folder; loglevel 2 = warning or lower)
filenames:
  - /logs/nextcloud/nextcloud.log
labels:
  type: Nextcloud
