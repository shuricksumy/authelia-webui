# Traefik static configuration.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: {to: websecure, scheme: https}
  websecure:
    address: ":443"
  internal: # the configurator only; published on the VPN address in compose.yml
    address: ":8443"
  tmapi: # optional Traefik Manager add-on only (docs/traefik-manager.md); never published.
    address: ":8081" # Without traefik/dynamic/traefik-manager.yml no router listens here.

# The API is used by the optional Traefik Manager add-on only: routers expose it, there is no
# insecure mode and no dashboard. Nothing serves api@internal unless that add-on's file is present.
api:
  dashboard: false

certificatesResolvers:
  le:
    acme:
      email: admin@example.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
      # If authcfg.<domain> is not resolvable from the internet (internal DNS only), use a DNS
      # challenge instead, e.g. (with your DNS provider's token in Traefik's environment):
      # dnsChallenge:
      #   provider: cloudflare

providers:
  file:
    # A folder: every .yml in it is loaded. Lets add-ons (docs/traefik-manager.md) ship their own
    # routers, and a web editor write atomically (temp file + rename) next to the file it edits.
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
accessLog: {}
