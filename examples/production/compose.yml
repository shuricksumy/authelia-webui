# Production-like stack: Traefik (HTTPS + a VPN-only entrypoint) -> Authelia (+ Redis for sessions)
# -> apps, plus the Authelia Configurator and its socket proxy. Everything a fresh install needs.
#
#   cp production.env.example .env    # then fill it in (see README.md)
#   docker compose config -q && docker compose up -d
#
# Layout (next to this file):
#   traefik/traefik.yml, traefik/dynamic.yml   Traefik static + file-provider config
#   authelia/configuration.yml                 Authelia main config (hand-edited, read-only to the configurator)
#   authelia/managed/                          written by the configurator only (rules, OIDC clients,
#                                              users, signing keys; private keys in managed/secrets/)
#   authelia/logs/                             Authelia's log (rotate it on the host: logrotate/authelia)
#   redis/                                     Authelia's sessions (survive every apply's restart)
#   letsencrypt/                               ACME account and certificates (created by Traefik)
name: authelia

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24 # fixed, so the configurator can trust exactly Traefik's address
  proxy:
    internal: true # the socket proxy and the configurator only; no route out
  sessions:
    internal: true # Redis and Authelia only

services:
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      # The configurator's entrypoint is published on the VPN address only (see README:
      # client IPs must reach Traefik unchanged for the network check to work).
      - "${VPN_ADDRESS:?set VPN_ADDRESS, the host's VPN IP}:8443:8443"
    volumes:
      - ./traefik:/etc/traefik:ro
      - ./letsencrypt:/letsencrypt
    networks:
      edge:
        ipv4_address: 172.30.0.2
    # No Docker socket: routes come from traefik/dynamic.yml (file provider).

  authelia:
    image: authelia/authelia:${AUTHELIA_VERSION:?set AUTHELIA_VERSION, e.g. 4.39.28}
    container_name: authelia # AUTHELIA_CONTAINER and the socket proxy rules use this name
    restart: unless-stopped
    user: "${AUTHELIA_UID:-1000}:${AUTHELIA_GID:-1000}"
    environment:
      # Later files override earlier ones; maps merge, lists are replaced. access_control, the
      # OIDC clients and the signing keys live only in managed/.
      X_AUTHELIA_CONFIG: /config/configuration.yml,/config/managed/access_control.yml,/config/managed/oidc_clients.yml,/config/managed/oidc_jwks.yml
      # oidc_jwks.yml names the private key files ({{ secret "..." }}) instead of holding them,
      # so keys stay out of git and the configurator can rotate them (Keys page).
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -base64 32)}
      TZ: ${TZ:-UTC}
    volumes:
      - ./authelia:/config
    networks: [edge, sessions]
    depends_on: [redis]

  redis: # Authelia's sessions: an apply restarts Authelia, and nobody is signed out by it
    image: redis:8-alpine
    restart: unless-stopped
    user: "${AUTHELIA_UID:-1000}:${AUTHELIA_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--dir", "/data"]
    volumes:
      - ./redis:/data # sessions also survive a Redis restart
    networks: [sessions]

  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64M
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=configurator
      # Exactly two calls: inspect and restart of the Authelia container. Nothing else.
      - -allowGET=/v1\..{1,2}/containers/authelia/json
      - -allowPOST=/v1\..{1,2}/containers/authelia/restart
      - -allowhealthcheck
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # the only container that sees the socket
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [proxy]

  configurator:
    <<: *hardened
    # The tag must match AUTHELIA_VERSION: the image bundles that exact Authelia binary.
    image: ghcr.io/shuricksumy/authelia-configurator:authelia-${AUTHELIA_VERSION}
    restart: unless-stopped
    user: "${AUTHELIA_UID:-1000}:${AUTHELIA_GID:-1000}" # same owner as authelia/managed
    environment:
      AUTH_DOMAIN: auth.${DOMAIN:?set DOMAIN, e.g. example.com}
      CONFIGURATOR_DOMAIN: authcfg.${DOMAIN}
      # Who may use the configurator. A dedicated group (only you in it) beats a general "admin".
      ADMIN_GROUP: ${ADMIN_GROUP:-admin}
      # The addresses Traefik sees for your VPN/LAN (a NAT gateway shows up as its own address:
      # the status bar and the 403 page show "your address as seen here").
      ALLOWED_CLIENT_CIDRS: ${VPN_CIDR:?set VPN_CIDR, e.g. 10.8.0.0/24} # fails closed when unset
      # Owner opt-in: use it from ANY network, protected by Authelia alone (group + 2FA). Off by
      # default; a banner says so while it is on. See the main README before turning it on.
      ALLOW_ANY_CLIENT_NETWORK: ${ALLOW_ANY_CLIENT_NETWORK:-false}
      CONFIG_FILTERS: template # same filter as Authelia: validation must see what Authelia sees
      TRUSTED_PROXY_CIDRS: 172.30.0.2/32 # Traefik only
      AUTHELIA_CONTAINER: authelia
      AUTHELIA_HEALTH_URL: http://authelia:9091/api/health
      AUTHELIA_LOG_FILE: /config/logs/authelia.log # Logs page and rollback hints (log.file_path)
      DOCKER_PROXY_URL: http://socket-proxy:2375
      USERS_FILE: /config/managed/users.yml
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY (openssl rand -base64 48)}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # Break-glass login for when Authelia is down; see docs/emergency.md. Both or neither.
      EMERGENCY_PORT: ${EMERGENCY_PORT:-}
      EMERGENCY_PASSWORD_HASH: ${EMERGENCY_PASSWORD_HASH:-}
      EMERGENCY_HOSTS: ${EMERGENCY_HOSTS:-} # optional extra IPs it answers to (docs/emergency.md)
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-} # optional: sites that may frame it (main README)
    ports:
      # Loopback only, never 0.0.0.0: reach it with `ssh -L 8090:127.0.0.1:8090 you@server`.
      # Without EMERGENCY_PORT nothing listens there.
      - "127.0.0.1:${EMERGENCY_PORT:-8090}:${EMERGENCY_PORT:-8090}"
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro # never written by the configurator
      # A folder, not the file: logrotate replaces the file, a single-file mount would go stale
      - ./authelia/logs:/config/logs:ro
      - ./authelia/managed:/config/managed # the only place it writes
    networks: [edge, proxy]
    depends_on:
      socket-proxy: {condition: service_healthy}
      authelia: {condition: service_started}

  whoami: # demo app behind Authelia; replace with your own services
    image: traefik/whoami:v1.11
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
