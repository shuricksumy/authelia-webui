name: LibreChat
description: Chat front end for AI models.
notes: Authelia 4.39 wants the offline_access scope whenever refresh_token is a grant type, so it is added to the guide's scopes.
host_label: LibreChat address
guide: librechat
client:
  client_name: LibreChat
  public: false
  authorization_policy: two_factor
  require_pkce: false
  pkce_challenge_method: ''
  redirect_uris:
    - https://app.example.com/oauth/openid/callback
  scopes: [openid, profile, email, offline_access]
  response_types: [code]
  grant_types: [authorization_code, refresh_token]
  access_token_signed_response_alg: none
  userinfo_signed_response_alg: none
  token_endpoint_auth_method: client_secret_basic
