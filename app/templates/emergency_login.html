<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emergency access · Authelia Configurator</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="container emergency-login">
    <h1>Emergency access</h1>
    <article class="notice error">
      <strong>This door does not use Authelia.</strong> It exists for when Authelia is down. Use it
      only through an SSH tunnel or an encrypted VPN; every login is recorded.
    </article>
    {% if message %}<p class="flash error" role="alert">{{ message }}</p>{% endif %}
    <form method="post" action="/emergency/login">
      <label for="password">Emergency password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
