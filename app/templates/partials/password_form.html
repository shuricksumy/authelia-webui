<dialog open aria-labelledby="dlg-title">
  <article>
    <header><button type="button" aria-label="Close" rel="prev" data-close></button><h3 id="dlg-title">New password for {{ uname }}</h3></header>
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <form hx-post="/users/{{ uname|urlencode }}/password" hx-target="#modal" hx-swap="innerHTML">
      <input type="hidden" name="users_rev" value="{{ users_rev }}">
      <fieldset class="checks">
        <label><input type="radio" name="pw_mode" value="generate" checked> Generate one (shown once, meets your password policy)</label>
        <label><input type="radio" name="pw_mode" value="typed"> Type one</label>
      </fieldset>
      <label for="pw-typed">Password <small>only when you chose "Type one"</small>
        <input id="pw-typed" name="password" type="password" autocomplete="new-password"></label>
      <footer><button type="button" class="secondary" data-close>Cancel</button><button type="submit">Set password</button></footer>
    </form>
  </article>
</dialog>
