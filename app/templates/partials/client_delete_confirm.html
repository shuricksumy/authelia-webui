<dialog open aria-labelledby="dlg-title">
  <article>
    <header><button type="button" aria-label="Close" rel="prev" data-close></button><h3 id="dlg-title">Delete client?</h3></header>
    <p>This removes <strong>{{ client_name or client_id }}</strong> (<code>{{ client_id|truncate(40, true, '…') }}</code>) from the <em>draft</em>.
      Once applied, the app using it can no longer log in. Nothing is applied until you review and apply.</p>
    <footer>
      <button type="button" class="secondary" data-close>Cancel</button>
      <button type="button" class="danger" hx-post="/clients/{{ index }}/delete">Delete client</button>
    </footer>
  </article>
</dialog>
