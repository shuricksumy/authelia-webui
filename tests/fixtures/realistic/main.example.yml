## Synthetic replica of a real-world config's STRUCTURE (see docs/real-world-patterns.md).
## All values are fake. __GEN_*__ placeholders are replaced at test time with
## values generated by the bundled authelia binary (into tests/fixtures/generated/).
## Messiness (comments, blank lines, mixed quoting/indent) is intentional — keep it.
theme: light

identity_validation:
  reset_password:
    jwt_secret: __GEN_SECRET_64__


server:
  address: 'tcp://0.0.0.0:9091/'
  disable_healthcheck: false
  headers:
    #csp_template: ""
    csp_template: "frame-ancestors 'self' https://example.com https://*.example.com;"
  endpoints:
    enable_expvars: false
    enable_pprof: false
    authz: {}
#      forward-auth:
#        implementation: ForwardAuth
#        authn_strategies:
#          - name: CookieSession

log:
  level: error
  #level: debug
  format: json
  file_path: /config/authelia.log
  keep_stdout: false

totp:
  disable: false
  issuer: example.com

ntp:
  disable_startup_check: true

authentication_backend:
  password_reset:
    disable: false
    custom_url: ""

  file:
    path: /config/users.yml
    watch: true
    extra_attributes:
      photo_quota:
        #name: 'photo_quota'
        multi_valued: false
        value_type: 'integer'
    search:
      email: true
      case_insensitive: false
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16


password_policy:
  standard:
    enabled: true
    min_length: 8
    max_length: 0
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: true

access_control:
  # Default policy can either be 'bypass', 'one_factor', 'two_factor' or 'deny'.
  default_policy: deny

  rules:
#    - domain: "auth.example.com"
#      policy: bypass

    # 1. Public endpoints (Must be bypassed so OIDC works)
    - domain: auth.example.com
      resources:
        - '^/\.well-known/openid-configuration$'
        - '^/jwks\.json$'
        - '^/api/oidc/.*' # Required for OIDC flows
      policy: bypass

    # 2. Protect the actual Authelia Portal/Settings
    # This ensures that to change your own settings, you must be logged in.
    - domain: auth.example.com
      policy: one_factor

#    - domain: "home.example.com"
#      policy: bypass
#      resources:
#        - "^/api.*"
#        - "^/auth/.*"
#        - "^/static.*"

    - domain: "home.example.com"
      policy: bypass
      resources:
        - "^/api/.*"
        - "^/auth/token$"
        - "^/auth/authorize.*"
        - "^/static/.*"
#        - "^/frontend_latest/.*"
        - "^/local/.*"
        - "^/manifest.json$"

    - domain: "home.example.com"
      subject:
        - ['user:dave']
        - ['user:erin']
        - ['group:admin']
        - ['group:home']
      policy: two_factor
#      resources:
#        - '^(?!/addon_panel).*$'

    - domain: cloud.example.com
      policy: bypass
      resources:
        - '^/api.*$'
        - '^/status.php$'
        - '^/remote.php/dav.*$'
        # - '^/index.php/login/v2.*$'
        # - '^/index.php/apps/news/api/.*$'


    # Pre-login + OAuth round-trip that must be public
    - domain: photos.example.com
      policy: bypass
      resources:
        - '^/api/server/ping$'
        - '^/api/server/version$'
        - '^/api/oauth/authorize$'
        - '^/api/oauth/callback$'
        - '^/favicon\.ico$'

    # Let the app validate its own tokens for all API calls
    - domain: photos.example.com
      policy: bypass
      resources:
        - '^/api/.*$'

    - domain: "photos.example.com"
      subject:
        - ['group:family']
      policy: two_factor

    - domain: notes.example.com
      policy: bypass
      resources:
        - '^/_session.*$'       # CouchDB auth endpoint
        - '^/_up.*$'            # health check


    - domain: notes.example.com
      policy: two_factor        # or one_factor

    - domain: "hooks.example.com"
      resources:
        - "^/webhook.*"
        #- "^/mcp.*"
      policy: bypass


    - domain: "*.example.com"
      subject:
        - ['group:admin']
      policy: two_factor

session:
  name: authelia_session
  same_site: lax
  secret: __GEN_SECRET_64__
  expiration: 1h
  inactivity: 5m
  remember_me: 1M
  cookies:
    - domain: 'example.com'
      authelia_url: 'https://auth.example.com'
      default_redirection_url: 'https://example.com'
#default_2fa_method: "totp"


storage:
  encryption_key: __GEN_SECRET_64__
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
#  smtp:
#    address: 'submission://192.0.2.25:25'
#    username: admin@example.com
#    password: __PLACEHOLDER__
  filesystem:
    filename: /config/notification.txt





identity_providers:
  oidc:
    hmac_secret: __GEN_SECRET_64__
    jwks:
      - key_id: __GEN_UUID__
        algorithm: 'RS256'
        use: 'sig'
        key: |
          __GEN_RSA_PRIVATE_KEY_PEM__

        certificate_chain: |
          __GEN_RSA_CERT_PEM__


    enforce_pkce: 'public_clients_only'
    authorization_policies:
      policy_name:
        default_policy: 'two_factor'
        rules:
          - policy: 'deny'
            subject: 'group:services'
    cors:
      endpoints:
        - 'authorization'
        - 'token'
      allowed_origins:
        - 'https://example.com'
      allowed_origins_from_client_redirect_uris: false

    claims_policies:
        default:
          id_token: ['groups', 'email', 'email_verified', 'preferred_username', 'name']
        access_proxy:
          id_token: ['rat', 'groups', 'email', 'preferred_username', 'name']
        photos_policy:
          custom_claims:
            photo_quota:
              attribute: 'photo_quota'

    scopes:
      photos_scope:
        claims:
          - 'photo_quota'

    clients:
      - client_id: 'garage_app'
        authorization_policy: 'two_factor'
        claims_policy: 'default'
        client_secret: '__GEN_PBKDF2_HASH__'
        public: false
        scopes:
          - openid
          - groups
          - email
          - profile
          - offline_access
        redirect_uris: # adjust to your domains
          - https://garage.example.com/api/session/openid/callback
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        response_types:
          - 'code'
        response_modes:
          - 'form_post'
        consent_mode: 'auto'
        #consent_mode: 'explicit'
        pre_configured_consent_duration: '6 months'
      - client_id: 'portainer'
        authorization_policy: 'two_factor'
        claims_policy: 'default'
        client_secret: '__GEN_PBKDF2_HASH__'
        token_endpoint_auth_method: client_secret_post
        userinfo_signed_response_alg: 'none'
        public: false
        scopes:
          - openid
          - groups
          - email
          - profile
        redirect_uris: # adjust to your domains
          - https://admin.example.com/portainer/
          - https://admin.example.com/portainer
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        consent_mode: 'auto'

      - client_id: 'photos'
        authorization_policy: 'two_factor'
        claims_policy: 'photos_policy'
        client_secret: '__GEN_PBKDF2_HASH__'
        token_endpoint_auth_method: 'client_secret_post'
        public: false
        require_pkce: false
        redirect_uris:
          - 'https://photos.example.com/auth/login'
          - "https://photos.example.com/api/oauth/mobile-redirect"
        scopes:
          - openid
          - email
          - profile
          - offline_access
          - photos_scope
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        response_types:
          - 'code'
        #consent_mode: 'auto'
        consent_mode: 'explicit'
        pre_configured_consent_duration: '6 months'
        id_token_signed_response_alg: 'RS256'
        userinfo_signed_response_alg: 'RS256'


      - client_id: 'access_proxy'
        client_name: 'Access Proxy'
        claims_policy: 'access_proxy'
        client_secret: '__GEN_ARGON2_HASH__'
        public: false
        authorization_policy: 'two_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://access.example.test/cdn-cgi/access/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'

      - client_id: 'chat'
        client_name: 'Chat'
        claims_policy: 'default'
        client_secret: '__GEN_ARGON2_HASH__'
        public: false
        authorization_policy: 'two_factor'
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://chat.example.com/oauth/openid/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'offline_access'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        token_endpoint_auth_method: 'client_secret_post'

