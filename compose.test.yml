# Integration/e2e stack. Hosts and data are synthetic (example.com); secrets are generated by
# `make stack` into tests/fixtures/generated/stack/ (gitignored).
# Traefik, the socket proxy and whoami join in Phase 1 with the network-isolation tests.
services:
  authelia:
    image: authelia/authelia:${AUTHELIA_VERSION:?run via make so the pinned version is set}
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml,/config/managed/access_control.yml,/config/managed/oidc_clients.yml
    volumes:
      - ./tests/fixtures/generated/stack:/config
    ports:
      - "127.0.0.1:19091:9091"   # test-only; the configurator itself publishes nothing

  configurator:
    build:
      context: .
      args:
        AUTHELIA_VERSION: ${AUTHELIA_VERSION:?run via make so the pinned version is set}
    environment:
      AUTH_DOMAIN: auth.example.com
      CONFIGURATOR_DOMAIN: authcfg.example.com
      ADMIN_GROUP: admin
      ALLOWED_CLIENT_CIDRS: 10.8.0.0/24,192.0.2.0/24
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      AUTHELIA_CONTAINER: authelia
      AUTHELIA_HEALTH_URL: http://authelia:9091/api/health
      APP_SECRET_KEY: ${TEST_APP_SECRET_KEY:?run via make}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      authelia:
        condition: service_healthy
